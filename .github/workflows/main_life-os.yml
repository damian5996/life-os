# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - life-os

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Wpisz DEPLOY PRODUCTION po testach Dev i akceptacji wydania'
        required: true
        type: string
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build src/LifeOs.Api/LifeOs.Api.csproj --configuration Release

      - name: Test backend
        run: dotnet test LifeOs.Backend.slnx --configuration Release

      - name: dotnet publish
        run: dotnet publish src/LifeOs.Api/LifeOs.Api.csproj -c Release --no-build -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY PRODUCTION'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E66C17A16CC746E9B49E6C6171AA47D2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E40591982E1F4E9CAFEEBD29905E6F5B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9B8CFC9B1CA9493789A59E7541061BA9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'life-os'
          slot-name: 'Production'
          package: ./publish
          startup-command: 'dotnet /home/site/wwwroot/LifeOs.Api.dll'

      - name: Configure Polish transcription and restart after replacing assemblies
        run: |
          resource_group=$(az webapp list --query "[?name=='life-os'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group"
          # Only these non-secret values may be logged. Never print all settings.
          az webapp config appsettings list -g "$resource_group" -n life-os --query "[?name=='Llm__TranscriptionModel' || name=='Llm__TranscriptionLanguage' || name=='Llm__TranscriptionFallbackModel'].{name:name,value:value}"
          az webapp config appsettings set -g "$resource_group" -n life-os --settings Llm__TranscriptionModel=gpt-4o-transcribe Llm__TranscriptionFallbackModel=gpt-4o-transcribe --output none
          az webapp restart --name life-os --resource-group "$resource_group"

      - name: Verify the public application is ready
        env:
          LIFEOS_URL: https://life-os-eeg7cpfyf6ctb9ff.westeurope-01.azurewebsites.net
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['LIFEOS_URL']
          required = {'/api/captures/export', '/api/review', '/api/captures/{id}/restore'}
          for attempt in range(24):
              try:
                  request = urllib.request.Request(
                      base + '/swagger/v1/swagger.json', headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      schema = json.load(response)
                  if not required.issubset(schema.get('paths', {})):
                      raise ValueError('The server is still serving an older API')
                  for path in ('/api/captures?limit=1', '/_content/LifeOs.Shared/app.css'):
                      with urllib.request.urlopen(base + path, timeout=15) as response:
                          if response.status != 200:
                              raise ValueError('Application readiness check failed')
                  print('Public API, database-backed history and shared assets are ready.')
                  break
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  print(f'Waiting for application startup ({attempt + 1}/24): {type(error).__name__}')
                  if attempt == 23:
                      raise SystemExit('Deployment did not become healthy')
                  time.sleep(10)
          PY
